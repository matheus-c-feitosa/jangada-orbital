[project]
name = "jangada-pipeline"
version = "0.1.0"
description = "NASA FIRMS hotspots (MODIS + VIIRS) to a harmonized burning activity calendar"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
]

[project.scripts]
jangada-check = "jangada.check_access:main"
jangada-probe = "jangada.probe_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jangada"]
